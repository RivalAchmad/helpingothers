<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg4)" />
  <circle cx="500" cy="90" r="110" fill="rgba(255,255,255,0.08)" />
  
  <!-- Heart and Home Icon Illustration -->
  <g transform="translate(175, 45)" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="25" y="75" width="200" height="145" rx="10" fill="rgba(255,255,255,0.12)" />
    <polygon points="125,15 10,75 240,75" fill="rgba(255,255,255,0.2)" />
    <!-- Big Glowing Heart -->
    <path d="M 125,100 C 125,75 90,75 90,105 C 90,130 125,155 125,155 C 125,155 160,130 160,105 C 160,75 125,75 125,100 Z" 
          fill="#f43f5e" stroke="#ffe4e6" stroke-width="3" />
    <!-- Doorway below heart -->
    <rect x="100" y="165" width="50" height="55" rx="6" fill="rgba(255,255,255,0.35)" />
    <!-- Windows -->
    <rect x="45" y="105" width="30" height="35" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="175" y="105" width="30" height="35" rx="4" fill="rgba(255,255,255,0.3)" />
  </g>

  <rect x="30" y="275" width="540" height="45" rx="12" fill="rgba(0,0,0,0.3)" />
  <text x="300" y="303" text-anchor="middle" fill="#fff7ed" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="bold">
    Panti Jompo Yayasan Kasih Mandiri
  </text>
</svg>

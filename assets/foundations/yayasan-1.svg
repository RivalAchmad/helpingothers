<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg1)" />
  <circle cx="520" cy="60" r="140" fill="rgba(255,255,255,0.08)" />
  <circle cx="80" cy="280" r="100" fill="rgba(255,255,255,0.06)" />
  
  <!-- Building Outline Illustration -->
  <g transform="translate(180, 50)" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="70" width="180" height="150" rx="10" fill="rgba(255,255,255,0.12)" />
    <polygon points="120,20 10,70 230,70" fill="rgba(255,255,255,0.18)" />
    <!-- Pillars / Windows -->
    <rect x="55" y="90" width="30" height="40" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="105" y="90" width="30" height="40" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="155" y="90" width="30" height="40" rx="4" fill="rgba(255,255,255,0.3)" />
    <!-- Door -->
    <rect x="95" y="160" width="50" height="60" rx="6" fill="rgba(255,255,255,0.35)" />
    <!-- Medical Cross -->
    <path d="M120,38 L120,54 M112,46 L128,46" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Trees -->
  <g transform="translate(140, 190)" fill="#059669" opacity="0.9">
    <path d="M 0,50 Q 20,10 40,50 Z" />
    <rect x="16" y="50" width="8" height="20" fill="#047857" />
  </g>
  <g transform="translate(420, 190)" fill="#059669" opacity="0.9">
    <path d="M 0,50 Q 20,10 40,50 Z" />
    <rect x="16" y="50" width="8" height="20" fill="#047857" />
  </g>

  <rect x="30" y="275" width="540" height="45" rx="12" fill="rgba(0,0,0,0.3)" />
  <text x="300" y="303" text-anchor="middle" fill="#ecfdf5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="bold">
    Panti Sosial Tresna Werdha Budi Mulia 1
  </text>
</svg>

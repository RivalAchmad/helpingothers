<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg5)" />
  <circle cx="510" cy="80" r="120" fill="rgba(255,255,255,0.08)" />
  
  <!-- Classic Chapel/Sanctuary Care Facility -->
  <g transform="translate(170, 45)" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="80" width="200" height="140" rx="10" fill="rgba(255,255,255,0.12)" />
    <!-- Tower and Bell / Cross -->
    <rect x="105" y="20" width="50" height="60" rx="6" fill="rgba(255,255,255,0.2)" />
    <polygon points="130,0 100,20 160,20" fill="rgba(255,255,255,0.3)" />
    <!-- Cross on top -->
    <line x1="130" y1="2" x2="130" y2="16" stroke="white" stroke-width="3" />
    <line x1="124" y1="7" x2="136" y2="7" stroke="white" stroke-width="3" />

    <!-- Stained glass arch -->
    <path d="M 115,130 L 115,105 A 15,15 0 0,1 145,105 L 145,130 Z" fill="#fde047" opacity="0.8" />
    <!-- Arched Portal Door -->
    <path d="M 110,220 L 110,165 A 20,20 0 0,1 150,165 L 150,220 Z" fill="rgba(255,255,255,0.35)" />
    <!-- Windows Left & Right -->
    <rect x="50" y="110" width="30" height="40" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="180" y="110" width="30" height="40" rx="4" fill="rgba(255,255,255,0.3)" />
  </g>

  <rect x="30" y="275" width="540" height="45" rx="12" fill="rgba(0,0,0,0.3)" />
  <text x="300" y="303" text-anchor="middle" fill="#f0fdfa" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="bold">
    Panti Lansia Santa Anna
  </text>
</svg>
